# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference#package-ecosystem-

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "swift"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # asian-autocorrect is pinned to the head of
      # https://github.com/huacnlee/autocorrect/pull/277, which adds the
      # autocorrect-swift crate that run.sh builds. That pull request was
      # closed unmerged, so AutoCorrect's main branch has no such crate and a
      # bump to it cannot build.
      - dependency-name: "asian-autocorrect"
