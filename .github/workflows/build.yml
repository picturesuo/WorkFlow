name: Build Check

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake libomp rust
      - name: Build with run.sh
        run: ./run.sh build
      - name: Run deterministic tests
        run: |
          xcodebuild test -quiet \
            -scheme OpenSuperWhisper \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            -clonedSourcePackagesDirPath SourcePackages \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGNING_REQUIRED=NO \
            -only-testing:OpenSuperWhisperTests/BedrockCleanupServiceTests \
            -only-testing:OpenSuperWhisperTests/TranscriptCleanupPipelineTests \
            -only-testing:OpenSuperWhisperTests/BedrockPricingTests \
            -only-testing:OpenSuperWhisperTests/LatestDictationGateTests \
            -only-testing:OpenSuperWhisperTests/ClipboardRestoreTests \
            -only-testing:OpenSuperWhisperTests/EmptyDictationDiscardTests
