name: Notarized Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    if: ${{ vars.ENABLE_NOTARIZED_RELEASES == 'true' }}
    runs-on: macos-latest
    env:
      WORKFLOW_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      WORKFLOW_NOTARY_PROFILE: workflow-ci-notary
      BUILD_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      INPUT_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Require release credentials
        run: |
          required=(WORKFLOW_SIGNING_IDENTITY BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD)
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required GitHub secret: $name" >&2
              exit 1
            fi
          done

      - name: Install build dependencies
        run: brew install cmake libomp rust

      - name: Import Developer ID certificate
        run: |
          certificate_path="$RUNNER_TEMP/chat-release.p12"
          keychain_path="$RUNNER_TEMP/chat-release.keychain-db"
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Configure notarization
        run: |
          xcrun notarytool store-credentials "$WORKFLOW_NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD"

      - name: Resolve version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$INPUT_VERSION"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must use semantic versioning, for example 0.3.0." >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          xcodebuild test -quiet \
            -scheme OpenSuperWhisper \
            -configuration Debug \
            -derivedDataPath build \
            -destination 'platform=macOS,arch=arm64' \
            -only-testing:OpenSuperWhisperTests/BedrockCleanupServiceTests \
            -only-testing:OpenSuperWhisperTests/TranscriptCleanupPipelineTests \
            -only-testing:OpenSuperWhisperTests/BedrockPricingTests \
            -only-testing:OpenSuperWhisperTests/VocabularyAndRulesTests \
            -only-testing:OpenSuperWhisperTests/OpenAIChatCleanupServiceTests \
            -only-testing:OpenSuperWhisperTests/ProviderPipelineTests \
            -only-testing:OpenSuperWhisperTests/LatestDictationGateTests \
            -only-testing:OpenSuperWhisperTests/ClipboardRestoreTests \
            -only-testing:OpenSuperWhisperTests/EmptyDictationDiscardTests \
            CODE_SIGNING_ALLOWED=NO

      - name: Build, sign, notarize, and assess
        run: ./Scripts/package-release.sh "${{ steps.version.outputs.value }}"

      - name: Upload notarized artifact
        uses: actions/upload-artifact@v6
        with:
          name: WorkFlow-${{ steps.version.outputs.value }}-macOS-arm64
          path: dist/WorkFlow-${{ steps.version.outputs.value }}-macOS-arm64.zip
          if-no-files-found: error

      - name: Publish GitHub release for tag
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/WorkFlow-${{ steps.version.outputs.value }}-macOS-arm64.zip" --generate-notes --verify-tag
